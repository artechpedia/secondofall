<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Second of All</title>

  <!-- Fonts: clean (Inter) + code vibe (JetBrains Mono) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#000;             /* dasar hitam */
      --panel:#0e0e0f;       /* panel hitam keabu */
      --red:#ff1a1a;         /* merah utama (stage light) */
      --red-2:#c81313;       /* merah tua */
      --muted:#b9b9b9;       /* teks sekunder */
      --text:#ffffff;        /* teks utama */
      --ring:rgba(255,26,26,.45);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 70% -10%, rgba(255,26,26,.15), transparent 60%),
        radial-gradient(900px 400px at -10% 110%, rgba(255,26,26,.12), transparent 60%),
        linear-gradient(180deg, #050505, #000);
      overflow-x:hidden; padding:20px;
      position:relative;
    }

    /* Band vibes: subtle stage haze + vignette */
    body::before{
      content:""; position:fixed; inset:-10%;
      background:
        radial-gradient(800px 400px at 80% 0%, rgba(255,26,26,.18), transparent 60%),
        radial-gradient(600px 320px at 10% 100%, rgba(255,26,26,.12), transparent 60%);
      filter: blur(20px); z-index:-2; pointer-events:none;
    }
    /* Film grain + scanlines halus */
    body::after{
      content:""; position:fixed; inset:0;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 2px 4px),
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.03), transparent 30%);
      mix-blend-mode: soft-light; opacity:.6; z-index:-1; pointer-events:none;
    }

    .container{max-width:1100px; margin:0 auto}

    .header{
      text-align:center; margin:10px 0 22px;
      letter-spacing:.6px;
    }
    .title{
      font-weight:800; font-size:clamp(26px,4.5vw,48px);
      text-transform:uppercase;
      line-height:1.05; margin:0;
      text-shadow: 0 0 18px rgba(255,26,26,.35), 0 0 3px rgba(255,26,26,.9);
    }
    .subtitle{
      margin-top:8px; color:var(--muted); font-size:.95rem;
    }

    .owner-toggle{
      position:fixed; top:20px; right:20px; z-index:10;
      background: linear-gradient(180deg, var(--red), var(--red-2));
      color:#fff; border:0; border-radius:999px;
      padding:10px 16px; font-weight:700; cursor:pointer;
      box-shadow: 0 10px 30px rgba(255,26,26,.25);
      transition: transform .08s ease, box-shadow .2s ease;
    }
    .owner-toggle:hover{ transform: translateY(-1px); box-shadow: 0 14px 36px rgba(255,26,26,.32) }
    .owner-indicator{ font-size:.85rem; margin-left:8px; opacity:.9 }

    .form-container{
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px; padding:18px; backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      margin-bottom:20px;
    }
    .form-container h2{
      margin:4px 0 12px; font-weight:800; letter-spacing:.4px;
      font-size:1.15rem;
    }
    label{display:block; font-weight:600; margin:10px 0 8px}
    .row{display:flex; gap:12px; flex-wrap:wrap}
    .input, .select, .textarea{
      width:100%; border-radius:12px; border:1px solid rgba(255,255,255,.12);
      background: #0a0a0a; color:var(--text); padding:12px 14px;
      outline:none; transition: box-shadow .2s ease, border-color .2s ease;
      font-family: Inter, system-ui, sans-serif;
    }
    .textarea{min-height:120px; resize:vertical}
    .input:focus, .select:focus, .textarea:focus{
      border-color: var(--red);
      box-shadow: 0 0 0 4px var(--ring);
    }
    .button{
      background: linear-gradient(180deg, var(--red), var(--red-2));
      color:#fff; border:0; border-radius:12px;
      padding:12px 16px; font-weight:800; cursor:pointer;
      box-shadow: 0 10px 30px rgba(255,26,26,.22);
      transition: transform .08s ease, box-shadow .2s ease;
    }
    .button:hover{ transform: translateY(-1px); box-shadow: 0 14px 38px rgba(255,26,26,.3) }

    .board{
      display:grid; gap:16px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }
    .note{
      position:relative; background: var(--panel);
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px; padding:16px;
      box-shadow: 0 10px 24px rgba(0,0,0,.45);
      transition: transform .18s ease, box-shadow .18s ease;
      overflow:hidden;
    }
    .note::before{
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(500px 180px at -10% 0%, rgba(255,26,26,.12), transparent 60%);
      pointer-events:none;
    }
    .note:hover{ transform: translateY(-4px); box-shadow: 0 18px 36px rgba(0,0,0,.55) }
    .note.hidden{ display:none }           /* default: tersembunyi */
    body.owner .note.hidden{ display:block } /* Owner mode: tampilkan */

    .rating{
      display:flex; align-items:center; gap:6px; margin-bottom:10px;
      color:var(--red); font-weight:800; letter-spacing:.4px;
      text-shadow: 0 0 10px rgba(255,26,26,.55);
    }
    .glyph{ font-size:20px; line-height:1 }
    .alias{ font-weight:700; color:#fff; margin-bottom:8px }
    .desc{ color:#ddd; line-height:1.55 }
    .meta{ margin-top:10px; font-size:.8rem; color:var(--muted) }

    /* Subtle code rain (merah) di belakang konten */
    .code-rain{ position:fixed; inset:0; pointer-events:none; z-index:-1; }
    .code-rain span{
      position:absolute; color: rgba(255,26,26,.55);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; opacity:.9; filter: drop-shadow(0 0 6px rgba(255,26,26,.35));
      animation: fall 5.2s linear infinite;
      will-change: transform, opacity;
    }
    @keyframes fall{
      from{ transform: translateY(-10vh) translateX(0); opacity:.95 }
      to  { transform: translateY(110vh) translateX(10px); opacity:0.2 }
    }

    @media (max-width:640px){
      body{ padding:14px }
      .owner-toggle{ top:12px; right:12px; padding:8px 14px }
    }
  </style>
</head>
<body>
  <button class="owner-toggle" id="ownerToggle">
    Owner View <span class="owner-indicator" id="ownerIndicator">(OFF)</span>
  </button>

  <!-- Latar “IT codes” merah -->
  <div class="code-rain" id="codeRain"></div>

  <div class="container">
    <header class="header">
      <h1 class="title">Second of All</h1>
      <div class="subtitle">Artechpedia</div>
    </header>

    <section class="form-container">
      <h2>Submit Testimoni</h2>
      <form id="testimoniForm">
        <div class="row">
          <div style="flex:1 1 140px">
            <label for="rating">Satisfaction (0–5):</label>
            <select id="rating" class="select" required>
              <option value="" disabled selected>Pilih rating</option>
              <option>0</option><option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option>
            </select>
          </div>
          <div style="flex:2 1 240px">
            <label for="alias">Alias:</label>
            <input id="alias" class="input" placeholder="Tulis nama alias…" required/>
          </div>
        </div>
        <label for="desc" style="margin-top:10px">Description:</label>
        <textarea id="desc" class="textarea" rows="4" placeholder="Ceritakan pengalamanmu…" required></textarea>
        <div style="display:flex; justify-content:flex-end; margin-top:12px">
          <button type="submit" class="button">Save Testimoni</button>
        </div>
      </form>
    </section>

    <section class="board" id="board"></section>
  </div>

  <script>
    const board = document.getElementById('board');
    const form = document.getElementById('testimoniForm');
    const ownerToggle = document.getElementById('ownerToggle');
    const ownerIndicator = document.getElementById('ownerIndicator');
    const codeRain = document.getElementById('codeRain');

    // ---- Owner toggle (tampilkan juga rating < 4 saat ON)
    let owner = false;
    ownerToggle.addEventListener('click', () => {
      owner = !owner;
      document.body.classList.toggle('owner', owner);
      ownerIndicator.textContent = owner ? '(ON)' : '(OFF)';
    });

    // ---- Code rain merah (ringan)
    (function makeCodeRain(){
      const chars = '01{}[]<>=/*+-&|^~$#@';
      const N = 90; // jumlah kolom/elemen
      for(let i=0;i<N;i++){
        const s = document.createElement('span');
        s.textContent = chars[Math.floor(Math.random()*chars.length)];
        s.style.left = (Math.random()*100) + '%';
        s.style.animationDelay = (Math.random()*5) + 's';
        s.style.animationDuration = (4 + Math.random()*4) + 's';
        codeRain.appendChild(s);
      }
      // ubah isi berkala biar berasa "hidup"
      setInterval(()=>{
        [...codeRain.children].forEach(el=>{
          if(Math.random()<0.2){
            el.textContent = chars[Math.floor(Math.random()*chars.length)];
          }
        })
      }, 600);
    })();

    // ---- Render glyph rating 🎸 * rating (integer)
    function ratingGlyphs(r){
      const n = Math.max(0, Math.min(5, Number(r)|0));
      return '🎸'.repeat(n);
    }

    function addTestimoni(rating, alias, desc){
      const card = document.createElement('article');
      card.className = 'note ' + (rating < 4 ? 'hidden' : '');
      card.innerHTML = `
        <div class="rating">
          <span class="glyph">${ratingGlyphs(rating)}</span>
          <span>${rating}/5</span>
        </div>
        <div class="alias">${escapeHTML(alias)}</div>
        <div class="desc">${escapeHTML(desc)}</div>
        <div class="meta">Created: ${new Date().toLocaleString()}</div>
      `;
      board.prepend(card);
    }

    function escapeHTML(str=''){
      return str.replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[m]));
    }

    form.addEventListener('submit', e=>{
      e.preventDefault();
      const rating = document.getElementById('rating').value;
      const alias  = document.getElementById('alias').value.trim();
      const desc   = document.getElementById('desc').value.trim();
      if(!rating || !alias || !desc) return;

      addTestimoni(Number(rating), alias, desc);
      form.reset();
      // focus balik ke alias biar cepat input berikutnya
      document.getElementById('alias').focus();
    });

    // ---- Sample awal
    addTestimoni(5, 'CoderX', 'Amazing service! Highly recommend.');
    addTestimoni(3, 'Anon', 'It was okay, but could be better.');
    addTestimoni(4, 'TechFan', 'Good experience overall.');
    addTestimoni(0, 'HiddenUser', 'Not satisfied at all.');
  </script>
</body>
</html>
