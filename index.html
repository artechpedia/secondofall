<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Second of All</title>

  <!-- Clean & neat + code vibe -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    /* ============ TOKENS ============ */
    :root{
      --bg:#000;
      --panel:#0b0b0c;
      --panel-2:#111113;
      --line:rgba(255,255,255,.08);
      --red:#ff1a1a;
      --red-2:#c81313;
      --muted:#bdbdbd;
      --text:#fff;
      --ring:rgba(255,26,26,.4);
      --radius:14px;
      --pad:14px; /* compact */
      --maxw:1000px;
      --shadow:0 10px 28px rgba(0,0,0,.5);
      --gap:12px;
    }
    @media (min-width:720px){
      :root{ --pad:16px; --gap:14px; --radius:16px }
    }
    @media (min-width:1024px){
      :root{ --pad:18px; --gap:16px; }
    }

    /* ============ RESET/LAYOUT ============ */
    *{box-sizing:border-box}
    html,body{height:100%}
    html{scroll-behavior:smooth}
    body{
      margin:0; color:var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1100px 520px at 70% -10%, rgba(255,26,26,.18), transparent 60%),
        radial-gradient(800px 360px at -10% 100%, rgba(255,26,26,.12), transparent 60%),
        linear-gradient(180deg,#070707,#000);
      padding: env(safe-area-inset-top) var(--pad) env(safe-area-inset-bottom);
    }
    .container{
      max-width: var(--maxw);
      margin: 0 auto;
      display: grid;
      gap: var(--gap);
      container-type: inline-size; /* enable container queries */
    }

    /* Cinematic overlay (vignette + thin scanlines) */
    body::before{
      content:""; position:fixed; inset:-10%;
      background:
        radial-gradient(600px 280px at 15% 100%, rgba(255,26,26,.12), transparent 58%),
        radial-gradient(900px 420px at 92% 0%, rgba(255,26,26,.18), transparent 60%);
      filter: blur(18px); z-index:-2; pointer-events:none;
    }
    body::after{
      content:""; position:fixed; inset:0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.03), transparent 40%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 2px 4px);
      mix-blend-mode: soft-light; opacity:.6; z-index:-1; pointer-events:none;
    }

    /* ============ HEADER ============ */
    header{
      position: sticky; top: 0; z-index: 5;
      backdrop-filter: blur(6px);
      background: linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,.25) 90%, transparent);
      margin: calc(var(--gap)*-1) calc(var(--pad)*-1) 0;
      padding: 10px var(--pad) 12px;
      border-bottom: 1px solid var(--line);
    }
    .hero{
      display:flex; align-items:flex-end; justify-content:space-between;
      gap:12px; flex-wrap:wrap;
      max-width: var(--maxw); margin:0 auto;
    }
    .title{
      font-weight:800;
      font-size: clamp(22px, 5.2cqi, 44px); /* fluid by container inline size */
      letter-spacing:.6px;
      text-transform:uppercase;
      text-shadow: 0 0 16px rgba(255,26,26,.35), 0 0 2px rgba(255,26,26,.85);
      margin: 2px 0 0;
    }
    .blink{
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight:700; margin-left:6px;
      opacity:.9; border-right:2px solid var(--red);
      animation: cursor 1.2s steps(2,end) infinite;
    }
    @keyframes cursor{ 0%,100%{border-color:transparent} 50%{border-color:var(--red)} }
    .sub{
      font-size: clamp(12px, 3.2cqi, 14px);
      color:var(--muted);
      margin-top: 2px;
    }

    /* Owner toggle */
    .owner-toggle{
      background: linear-gradient(180deg,var(--red),var(--red-2));
      color:#fff; border:0; border-radius:999px;
      padding:8px 12px; font-weight:800; cursor:pointer;
      box-shadow: 0 8px 24px rgba(255,26,26,.26);
      transition: transform .06s ease, box-shadow .2s ease;
      font-size: clamp(12px, 3.6cqi, 14px);
    }
    .owner-toggle:hover{ transform: translateY(-1px); box-shadow: 0 12px 28px rgba(255,26,26,.34) }
    .owner-ind{ margin-left:6px; opacity:.92 }

    /* ============ PANELS ============ */
    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border:1px solid var(--line);
      border-radius: var(--radius);
      padding: var(--pad);
      box-shadow: var(--shadow);
    }

    /* Compact form grid */
    .form-grid{
      display:grid; gap: var(--gap);
      grid-template-columns: 1fr;
    }
    @container (min-width: 560px){
      .form-grid{ grid-template-columns: 220px 1fr; align-items:end }
    }
    label{ display:block; font-weight:700; margin: 2px 0 6px }

    .input, .select, .textarea{
      width:100%; border-radius: 12px;
      border:1px solid var(--line);
      background: var(--panel-2); color:var(--text);
      padding: 10px 12px;
      outline:none;
      font: 600 14px/1 Inter, system-ui, sans-serif;
      transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }
    .textarea{ min-height: 110px; resize: vertical }
    .input:focus, .select:focus, .textarea:focus{
      border-color: var(--red);
      box-shadow: 0 0 0 4px var(--ring);
      background: #0d0d0f;
    }
    .row{ display:flex; gap: var(--gap); flex-wrap:wrap; align-items:center; justify-content:flex-end }

    .button{
      background: linear-gradient(180deg,var(--red),var(--red-2));
      color:#fff; border:0; border-radius:12px;
      padding:10px 14px; font-weight:800; cursor:pointer;
      box-shadow: 0 10px 26px rgba(255,26,26,.22);
      transition: transform .06s ease, box-shadow .2s ease;
      font-size:14px;
    }
    .button:hover{ transform: translateY(-1px); box-shadow: 0 14px 32px rgba(255,26,26,.3) }

    /* ============ BOARD ============ */
    .board{
      display:grid; gap: var(--gap);
      grid-template-columns: repeat( auto-fill, minmax(220px, 1fr) );
    }
    @container (min-width: 720px){
      .board{ grid-template-columns: repeat( auto-fill, minmax(260px, 1fr) ); }
    }

    .note{
      position:relative; overflow:hidden;
      background: var(--panel);
      border:1px solid var(--line);
      border-radius: var(--radius);
      padding: calc(var(--pad) - 2px);
      box-shadow: var(--shadow);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .note::before{
      content:""; position:absolute; inset:0;
      background: radial-gradient(420px 160px at -10% 0%, rgba(255,26,26,.12), transparent 60%);
      pointer-events:none;
    }
    .note:hover{ transform: translateY(-3px); box-shadow: 0 16px 30px rgba(0,0,0,.6) }

    .note.hidden{ display:none }
    body.owner .note.hidden{ display:block }

    .rating{
      display:flex; align-items:center; gap:6px; margin-bottom:6px;
      color:var(--red); font-weight:800; letter-spacing:.3px;
      text-shadow: 0 0 10px rgba(255,26,26,.5);
      font-size: 13px;
    }
    .glyph{ font-size:18px; line-height:1 }
    .alias{ font-weight:800; color:#fff; margin:2px 0 6px; font-size: 15px }
    .desc{ color:#e7e7e7; line-height:1.55; font-size: 14px }
    .meta{ margin-top:8px; font-size:12px; color:var(--muted) }

    /* ============ IT CODE: lightweight “red code rain” ============ */
    .code-rain{ position:fixed; inset:0; pointer-events:none; z-index:-1 }
    .code-rain span{
      position:absolute; color: rgba(255,26,26,.55);
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size: 11px; filter: drop-shadow(0 0 6px rgba(255,26,26,.3));
      opacity:.9; animation: fall linear infinite;
      will-change: transform, opacity;
    }
    @keyframes fall{
      from{ transform: translateY(-8vh) translateX(0); opacity:.95 }
      to  { transform: translateY(108vh) translateX(8px); opacity:.18 }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce){
      *{ animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important }
    }
  </style>
</head>
<body>
  <!-- sticky header: compact & cinematic -->
  <header>
    <div class="hero">
      <div>
        <h1 class="title">Safe Palace<span class="blink">&nbsp;</span></h1>
        <div class="sub">Whisper your thought about Artechpedia</div>
      </div>
      <button class="owner-toggle" id="ownerToggle">Owner View <span class="owner-ind" id="ownerInd">(OFF)</span></button>
    </div>
  </header>

  <!-- subtle background code rain -->
  <div class="code-rain" id="codeRain"></div>

  <main class="container" id="app">
    <!-- FORM -->
    <section class="panel">
      <form id="form">
        <div class="form-grid">
          <div>
            <label for="rating">Satisfaction (0–5)</label>
            <select id="rating" class="select" required>
              <option value="" disabled selected>Select rating</option>
              <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </div>
          <div>
            <label for="alias">Alias</label>
            <input id="alias" class="input" placeholder="Your alias…" required/>
          </div>
          <div style="grid-column: 1 / -1">
            <label for="desc">Description</label>
            <textarea id="desc" class="textarea" rows="4" placeholder="Share your experience…" required></textarea>
          </div>
        </div>
        <div class="row" style="margin-top:10px">
          <button type="submit" class="button">Save Testimoni</button>
        </div>
      </form>
    </section>

    <!-- BOARD -->
    <section class="board" id="board"></section>
  </main>

  <script>
    // ===== Owner toggle (shows <4 ratings when ON) =====
    const ownerToggle = document.getElementById('ownerToggle');
    const ownerInd = document.getElementById('ownerInd');
    let owner = false;
    ownerToggle.addEventListener('click', ()=>{
      owner = !owner;
      document.body.classList.toggle('owner', owner);
      ownerInd.textContent = owner ? '(ON)' : '(OFF)';
    });

    // ===== Code rain (adaptive count for devices) =====
    const codeRain = document.getElementById('codeRain');
    (function makeCodeRain(){
      const chars = '01{}[]<>=/*+-&|^~$#@';
      const width = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
      const height = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
      // Fewer elements on small screens for stability
      const N = width < 420 ? 36 : width < 900 ? 64 : 96;
      for(let i=0;i<N;i++){
        const s = document.createElement('span');
        s.textContent = chars[Math.floor(Math.random()*chars.length)];
        s.style.left = (Math.random()*100) + '%';
        const delay = Math.random()*5;
        const dur = (width < 600 ? 5.5 : 4.5) + Math.random()*3.5;
        s.style.animationDuration = dur + 's';
        s.style.animationDelay = delay + 's';
        codeRain.appendChild(s);
      }
      setInterval(()=>{
        for(let i=0;i<6;i++){
          const el = codeRain.children[Math.floor(Math.random() * codeRain.children.length)];
          if (!el) break;
          el.textContent = chars[Math.floor(Math.random()*chars.length)];
        }
      }, 700);
    })();

    // ===== Helpers & App =====
    const board = document.getElementById('board');
    const form = document.getElementById('form');
    function escapeHTML(str=''){
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function ratingGlyphs(r){
      const n = Math.max(0, Math.min(5, Number(r)|0));
      // use guitar pick + bar for band + compact look
      return '🎸'.repeat(n);
    }
    function addTestimoni(rating, alias, desc){
      const card = document.createElement('article');
      card.className = 'note ' + (rating < 4 ? 'hidden' : '');
      card.innerHTML = `
        <div class="rating">
          <span class="glyph" aria-hidden="true">${ratingGlyphs(rating)}</span>
          <span>${rating}/5</span>
        </div>
        <div class="alias">${escapeHTML(alias)}</div>
        <div class="desc">${escapeHTML(desc)}</div>
        <div class="meta">Created: ${new Date().toLocaleString()}</div>
      `;
      board.prepend(card);
    }

    form.addEventListener('submit', e=>{
      e.preventDefault();
      const rating = document.getElementById('rating').value;
      const alias  = document.getElementById('alias').value.trim();
      const desc   = document.getElementById('desc').value.trim();
      if(!rating || !alias || !desc) return;
      addTestimoni(Number(rating), alias, desc);
      form.reset();
      document.getElementById('alias').focus();
    });

    // Sample content
    addTestimoni(5, 'CoderX', 'Stage-ready! Clean UI, blazing fast.');
    addTestimoni(3, 'Anon', 'Decent, but I prefer darker riffs.');
    addTestimoni(4, 'TechFan', 'Solid experience. Love the glow.');
    addTestimoni(0, 'HiddenUser', 'Not my tempo.');
  </script>
</body>
</html>
